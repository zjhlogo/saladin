<head>
  <title>通配符</title>
  <link href="../style.css" rel="stylesheet" type="text/css" />

</head>
<body>
<h1>通配符</h1>

<p>在使用掩码选择或取消选择文件以及搜索文件时，可以使用以下通配符：</p>

<table width="100%">
<tr>
 <th>通配符</th>
 <th>说明</th>
</tr>
<tr>
 <td valign="top">?</td>
 <td>匹配任意单个字符。</td>
</tr>
<tr>
 <td valign="top">*</td>
 <td>匹配零个或多个任意字符。</td>
</tr>
<tr>
 <td valign="top">[...]</td>
 <td>匹配集合中列出的任意字符。在集合中可以使用短横线表示字符范围，例如 [0-9] 匹配任意数字。</td>
</tr>
<tr>
 <td valign="top">[^...]</td>
 <td>匹配未在集合中列出的任意字符。</td>
</tr>
<tr>
 <td valign="top">;</td>
 <td>可用于分隔两个或多个模式。</td>
</tr>
</table>
</body>
</html>
